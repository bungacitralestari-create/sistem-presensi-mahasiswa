<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Sistem Presensi Mahasiswa</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body class="auth-page"><main class="auth-card"><div class="brand"><div class="logo">BC</div><div><b>Sistem Presensi Mahasiswa</b><span>Pemrograman Web • Sistem Absensi</span></div></div><div class="tabs"><button class="tab active" data-role="admin">Admin</button><button class="tab" data-role="mahasiswa">Mahasiswa</button></div><div class="auth-head"><small id="label">LOGIN ADMIN</small><h1>Selamat datang</h1><p id="help">Masuk untuk mengelola data absensi.</p></div><form id="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary" type="submit">Masuk</button><div id="msg" class="msg"></div></form></main><script>const c=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let wanted='admin';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{wanted=b.dataset.role;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');label.textContent=wanted==='admin'?'LOGIN ADMIN':'LOGIN MAHASISWA';help.textContent=wanted==='admin'?'Masuk untuk mengelola data absensi.':'Masuk untuk melihat riwayat dan melakukan absensi di kampus.'});form.onsubmit=async e=>{e.preventDefault();msg.textContent='Memeriksa akun...';let r=await c.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent=r.error.message;msg.className='msg error';return}let u=(await c.auth.getUser()).data.user;let p=await c.from('profiles').select('role').eq('id',u.id).maybeSingle();if(p.error||!p.data||p.data.role!==wanted){await c.auth.signOut();msg.textContent='Akun belum memiliki akses '+wanted+'.';msg.className='msg error';return}location.href=wanted==='admin'?'admin.html':'mahasiswa.html'};</script></body></html>
